<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EP Radar · Allied health & exercise jobs</title>
<!-- Lets the published site be added to a phone's home screen like an app. -->
<meta name="theme-color" content="#06080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EP Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>
  // Apply the saved (or system) theme before first paint to avoid a flash.
  (() => {
    let theme;
    try { theme = JSON.parse(localStorage.getItem("ep-radar:theme")); } catch {}
    document.documentElement.dataset.theme = theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  })();
</script>
<style>
  :root {
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);

    --bg: #06080c; --bg-2: #0b0f16; --surface: rgba(255,255,255,.035); --surface-2: rgba(255,255,255,.065); --surface-solid: #0d1219;
    --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
    --ink: #eef2f7; --ink-2: #a9b3c2; --ink-3: #6b7686; --on-accent: #06080c;
    --mint: #5eead4; --iris: #8b8cf8; --peach: #fdba74; --rose: #fb7185; --gold: #fcd34d; --green: #4ade80;
    --accent-grad: linear-gradient(135deg, #5eead4 0%, #8b8cf8 55%, #c084fc 100%);
    --glow: 0 0 0 1px rgba(139,140,248,.4), 0 14px 40px -14px rgba(94,234,212,.45);
    --shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 30px 60px -30px rgba(0,0,0,.7);
    --spot: rgba(139,140,248,.16);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f6fa; --bg-2: #eceef5; --surface: rgba(255,255,255,.72); --surface-2: #ffffff; --surface-solid: #ffffff;
    --line: rgba(15,23,42,.08); --line-2: rgba(15,23,42,.15);
    --ink: #0b1220; --ink-2: #475467; --ink-3: #8a94a6; --on-accent: #ffffff;
    --mint: #0d9488; --iris: #5b5bd6; --peach: #ea580c; --rose: #e11d48; --gold: #d97706; --green: #16a34a;
    --accent-grad: linear-gradient(135deg, #14b8a6 0%, #6366f1 55%, #a855f7 100%);
    --glow: 0 0 0 1px rgba(99,102,241,.35), 0 14px 36px -14px rgba(99,102,241,.4);
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 24px 48px -28px rgba(15,23,42,.25);
    --spot: rgba(99,102,241,.08);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body.locked { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; color: inherit; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
  kbd { font: 600 11px var(--font); min-width: 20px; text-align: center; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; color: var(--ink-3); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .theming, .theming *, .theming *::before, .theming *::after { transition: background-color .45s ease, border-color .45s ease, color .45s ease, fill .45s ease !important; }

  /* Ambient background */
  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora span { position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%; filter: blur(100px); opacity: .2; animation: drift 30s ease-in-out infinite alternate; }
  .aurora span:nth-child(1) { background: #14b8a6; top: -34vmax; left: -18vmax; }
  .aurora span:nth-child(2) { background: #6366f1; top: -30vmax; right: -24vmax; animation-duration: 36s; animation-delay: -9s; }
  .aurora span:nth-child(3) { background: #a855f7; top: 24vmax; left: 34vmax; opacity: .1; animation-duration: 44s; animation-delay: -18s; }
  :root[data-theme="light"] .aurora span { opacity: .13; }
  .grid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, #000 20%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, #000 20%, transparent 75%); opacity: .5; }
  .grain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .04; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: max(12px, env(safe-area-inset-top)) clamp(16px, 4vw, 40px) 12px; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: saturate(170%) blur(18px); -webkit-backdrop-filter: saturate(170%) blur(18px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 650; font-size: 15.5px; letter-spacing: -.01em; }
  .brand-sub { font-weight: 500; color: var(--ink-3); padding-left: 11px; border-left: 1px solid var(--line-2); }
  .logo { position: relative; width: 32px; height: 32px; border-radius: 10px; background: var(--accent-grad); overflow: hidden; box-shadow: var(--glow); }
  .logo::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1.5px solid rgba(6,8,12,.5); }
  .logo::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #06080c; }
  .logo .sweep { position: absolute; inset: 7px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(6,8,12,.6), transparent 38%); animation: spin 2.8s linear infinite; }
  .spacer { flex: 1; }
  .live { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 99px; background: var(--surface); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: ping 2.2s infinite; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: transform .25s var(--spring), background .2s, border-color .2s; }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--line-2); transform: translateY(-1px) rotate(-8deg); }

  /* Hero */
  .hero { position: relative; z-index: 1; max-width: 1480px; margin: 0 auto; padding: clamp(36px, 6vw, 76px) clamp(16px, 4vw, 40px) 30px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 550; color: var(--ink-2); }
  .eyebrow svg { color: var(--mint); }
  h1 { margin: 16px 0 14px; max-width: 17em; font-size: clamp(34px, 5.3vw, 66px); font-weight: 650; line-height: 1.03; letter-spacing: -.035em; }
  h1 .num { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
  h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; padding-right: .06em; background: linear-gradient(90deg, var(--mint), var(--iris), #c084fc, var(--mint)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 9s linear infinite; }
  .lede { max-width: 62ch; margin: 0 0 30px; color: var(--ink-2); font-size: clamp(15px, 1.35vw, 17px); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { position: relative; padding: 18px 18px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: transform .35s var(--spring), border-color .25s; }
  .stat:hover { transform: translateY(-3px); border-color: var(--line-2); }
  .stat .ico { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent); }
  .stat .n { margin-top: 14px; font-size: 34px; font-weight: 650; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .l { margin-top: 6px; font-size: 13px; font-weight: 550; }
  .stat .s { font-size: 12px; color: var(--ink-3); }
  .srcwrap { margin-top: 20px; }
  .srcbar { display: flex; gap: 3px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface); }
  .srcbar span { width: 0; border-radius: 99px; transition: width 1.4s var(--ease); }
  .srcbar.go span { width: var(--w); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 3px; }
  .legend b { margin-left: 6px; color: var(--ink); font-weight: 600; }
  .legend-note { margin-left: auto; color: var(--ink-3); }

  /* Toolbar */
  #sentinel { height: 1px; }
  .toolbar { position: sticky; top: var(--tb, 57px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px clamp(16px, 4vw, 40px); background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%); border-bottom: 1px solid transparent; transition: border-color .3s, box-shadow .3s; }
  .toolbar.stuck { border-color: var(--line); box-shadow: 0 14px 30px -24px rgba(0,0,0,.7); }
  .search { flex: 1 1 250px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); transition: border-color .2s, box-shadow .25s; }
  .search svg { color: var(--ink-3); }
  .search:focus-within { border-color: var(--iris); box-shadow: 0 0 0 4px color-mix(in srgb, var(--iris) 18%, transparent); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; }
  .search input::placeholder { color: var(--ink-3); }
  .seg { position: relative; display: flex; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { position: relative; z-index: 1; padding: 6px 12px; border: 0; border-radius: 9px; background: none; font-size: 13px; font-weight: 550; color: var(--ink-2); white-space: nowrap; cursor: pointer; transition: color .25s; }
  .seg button:hover, .seg button.active { color: var(--ink); }
  .seg button b { margin-left: 5px; font-size: 11px; font-weight: 600; color: var(--ink-3); }
  .seg-pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line-2); box-shadow: 0 6px 16px -8px rgba(0,0,0,.45); transition: transform .5s var(--spring), width .5s var(--spring); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 550; color: var(--ink-2); cursor: pointer; transition: color .2s, border-color .2s, background .2s, transform .3s var(--spring); }
  .chip:hover { color: var(--ink); border-color: var(--line-2); }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--iris) 60%, transparent); background: color-mix(in srgb, var(--iris) 15%, transparent); }
  .chip[aria-pressed="true"] svg { color: var(--iris); }
  .select { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 30px 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 550; }
  .select::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor; transform: rotate(45deg); pointer-events: none; }
  .select select { appearance: none; -webkit-appearance: none; border: 0; outline: 0; background: transparent; color: var(--ink); font-weight: 550; cursor: pointer; }
  .select option { background: var(--surface-solid); color: var(--ink); }
  .select.compact { height: 32px; padding: 0 28px 0 10px; border-radius: 10px; font-size: 12.5px; }

  /* Workspace */
  .workspace { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); gap: 24px; align-items: start; max-width: 1480px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px) 40px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 12px; font-size: 12.5px; color: var(--ink-3); }
  .list-head b { color: var(--ink); font-weight: 600; }
  .list-head .hint { display: flex; align-items: center; gap: 4px; }
  .linkish { margin-left: 8px; padding: 0; border: 0; background: none; color: var(--iris); font-weight: 550; cursor: pointer; }
  .linkish:hover { text-decoration: underline; text-underline-offset: 3px; }
  .list { display: grid; gap: 10px; }

  .spot { position: relative; overflow: hidden; isolation: isolate; }
  .spot::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 60%); opacity: 0; transition: opacity .35s; }
  .spot:hover::before { opacity: 1; }

  .card { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 13px; padding: 15px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: transform .35s var(--spring), border-color .25s, background .25s, box-shadow .3s; animation: rise .6s var(--ease) both; animation-delay: var(--d, 0ms); }
  .card:hover { transform: translateY(-2px); border-color: var(--line-2); }
  .card.active { border-color: transparent; background: var(--surface-2); box-shadow: var(--glow); }
  .card.active::after { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-grad); animation: grow .45s var(--spring); }
  .avatar { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 13px; background: var(--g); color: #fff; font-weight: 650; font-size: 15px; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.25); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 8px 20px -8px var(--gc); }
  .avatar.lg { width: 62px; height: 62px; border-radius: 17px; font-size: 20px; }
  .card h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.35; letter-spacing: -.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .org { margin-top: 3px; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .org span { color: var(--ink-3); margin: 0 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); font-size: 11.5px; font-weight: 550; color: var(--ink-2); white-space: nowrap; }
  .tag svg { width: 12px; height: 12px; }
  .tag.money { color: var(--mint); border-color: color-mix(in srgb, var(--mint) 25%, transparent); background: color-mix(in srgb, var(--mint) 9%, transparent); }
  .tag.hosp { color: var(--iris); border-color: color-mix(in srgb, var(--iris) 30%, transparent); background: color-mix(in srgb, var(--iris) 10%, transparent); }
  .tag.new { border-color: transparent; color: #1c1206; background: linear-gradient(90deg, #fdba74, #fde68a, #fdba74); background-size: 200% 100%; animation: shimmer 3s linear infinite; }
  .tag.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
  .tag.muted { color: var(--ink-3); }
  .c-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .ago { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .save { display: grid; place-items: center; width: 30px; height: 30px; margin: -4px -4px 0 0; border: 0; border-radius: 9px; background: none; color: var(--ink-3); cursor: pointer; transition: color .2s, background .2s; }
  .save:hover { color: var(--ink); background: var(--surface-2); }
  .save.on, .btn.on { color: var(--gold); }
  .save.on svg, .btn.on svg { fill: currentColor; }
  .pop { animation: pop .5s var(--spring); }

  /* Detail panel */
  .detail { position: sticky; top: var(--stick, 130px); max-height: calc(100vh - var(--stick, 130px) - 20px); overflow: auto; overscroll-behavior: contain; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: var(--shadow); scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .detail::-webkit-scrollbar { width: 10px; }
  .detail::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
  /* Phone sheet: a bar that stays at the top with a big way back, plus a drag handle. */
  .sheet-bar { display: none; position: sticky; top: 0; z-index: 5; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 16px 10px; background: color-mix(in srgb, var(--surface-solid) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); touch-action: none; }
  .grab { position: absolute; top: 7px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 99px; background: var(--line-2); }
  .back-btn { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px 0 8px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .back-btn svg { width: 18px; height: 18px; }
  .back-btn:active { transform: scale(.97); }
  .d-hero { position: relative; padding: 28px 30px 24px; border-bottom: 1px solid var(--line); overflow: hidden; }
  .d-hero::before { content: ""; position: absolute; inset: -120px -60px auto auto; width: 420px; height: 300px; background: radial-gradient(closest-side, color-mix(in srgb, var(--h1) 40%, transparent), transparent); opacity: .55; pointer-events: none; animation: breathe 7s ease-in-out infinite; }
  .d-hero::after { content: ""; position: absolute; inset: auto auto -140px -80px; width: 360px; height: 260px; background: radial-gradient(closest-side, color-mix(in srgb, var(--h2) 35%, transparent), transparent); opacity: .35; pointer-events: none; }
  .d-hero > * { position: relative; }
  .d-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .d-badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; padding-right: 0; }
  .d-title { margin: 16px 0 8px; font-size: clamp(22px, 2.2vw, 28px); font-weight: 650; line-height: 1.18; letter-spacing: -.025em; }
  .d-org { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-weight: 500; }
  .d-org span { display: inline-flex; align-items: center; gap: 7px; }
  .d-when { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .btn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 15px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 13.5px; font-weight: 600; cursor: pointer; overflow: hidden; transition: transform .3s var(--spring), border-color .2s, background .2s, box-shadow .3s; }
  .btn:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--iris) 70%, transparent); }
  .btn:active { transform: translateY(0) scale(.97); }
  .btn.primary { border: 0; color: var(--on-accent); background: var(--accent-grad); box-shadow: var(--glow); }
  :root:not([data-theme="light"]) .btn.primary { color: #06080c; }
  .btn.primary::after { content: ""; position: absolute; top: 0; left: -70%; width: 45%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); transform: skewX(-20deg); transition: left .75s var(--ease); }
  .btn.primary:hover::after { left: 135%; }
  .btn.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }
  .btn.ghost { height: 34px; margin-top: 10px; padding: 0 12px; background: transparent; font-size: 13px; }

  /* Scan-friendly detail sections */

  .fact { padding: 10px 12px; border-radius: 12px; }

  .verdict-row { display: flex; align-items: flex-start; gap: 10px; }
  .verdict-row .verdict { flex: none; margin: 1px 0 0; }
  .verdict-row p { margin: 0; font-weight: 550; line-height: 1.5; }
  .pc2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 20px; margin-top: 12px; }

  /* Empty states */

  .reveal { animation: rise .9s var(--ease) both; animation-delay: var(--d, 0ms); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(6vmax, 4vmax) scale(1.12); } 100% { transform: translate(-5vmax, 9vmax) scale(.94); } }

  }

<script>
const DATA = __DATA__;

const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const DAY = 864e5;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile = () => matchMedia("(max-width: 960px)").matches;
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("ep-radar:" + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem("ep-radar:" + key, JSON.stringify(value)); } catch {} },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? esc(u) : "#");
const EXT = 'target="_blank" rel="noopener"';
const icon = (name) => `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const time = (s) => { const t = Date.parse(s); return Number.isNaN(t) ? 0 : t; };
const isOpen = (j) => Date.now() - time(j.lastSeen) < 3 * DAY;
const isNew = (j) => Date.now() - time(j.listedAt) < 7 * DAY;
const fmtK = (n) => "$" + Math.round(n / 1000) + "k";
const fmtDate = (s) => (time(s) ? new Date(time(s)).toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" }) : "date unknown");

function ago(s) {
  const t = time(s);
  if (!t) return "";
  const secs = (Date.now() - t) / 1000;
  if (secs < 90) return "just now";
  if (secs < 3600) return Math.round(secs / 60) + "m ago";
  if (secs < 86400) return Math.round(secs / 3600) + "h ago";
  const days = Math.round(secs / 86400);
  return days < 30 ? days + "d ago" : new Date(t).toLocaleDateString("en-AU", { day: "numeric", month: "short" });
}
function hue(str) { let h = 7; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function initials(name) {
  const words = name.replace(/\b(pty|ltd|limited|inc|the|group|australia|services?)\b/gi, " ").split(/[\s&/()\-]+/).filter(Boolean);
  return ((words[0]?.[0] ?? "?") + (words[1]?.[0] ?? "")).toUpperCase();
}
function avatar(j, cls = "") {
  const h = hue(j.company);
  return `<div class="avatar ${cls}" style="--g:linear-gradient(135deg,hsl(${h} 75% 60%),hsl(${(h + 55) % 360} 70% 42%));--gc:hsl(${h} 70% 50% / .55)">${esc(initials(j.company))}</div>`;
}
// "Camberwell, Melbourne VIC" -> "Camberwell". Skips a first part that just repeats the employer
// ("The Victoria Clinic, Melbourne" at The Victoria Clinic -> "Melbourne").
function place(j) {
  const parts = (j.location || "").split(",").map((p) => p.replace(/\s+VIC\b.*$/i, "").trim()).filter(Boolean);
  return parts.find((p) => p.toLowerCase() !== j.company.toLowerCase()) ?? "";
}
function shortType(t = "") {
  const w = t.toLowerCase();
  const full = w.includes("full"), part = w.includes("part");
  if (full && part) return "Full or part time";
  if (full) return "Full time";
  if (part) return "Part time";
  if (w.includes("casual")) return "Casual";
  if (/contract|temp|fixed|locum/.test(w)) return "Contract";
  return t.split(",")[0];
}
function shortSalary(j) {
  const s = j.salary.replace(/A\$/g, "$").replace(/\.00\b/g, "").replace(/\s*per\s*(year|annum)/i, "/yr").replace(/\s*per\s*hour/i, "/hr").replace(/\s*per\s*week/i, "/wk").replace(/\s*\(.*$/, "").trim();
  return s.length <= 24 ? s : "≈ " + fmtK(j.salaryAnnual) + "/yr";
}
const TYPE_TESTS = { full: /full/, part: /part/, casual: /casual/, temp: /temp|contract|fixed|locum/ };
const matchesType = (j, type) => !type || TYPE_TESTS[type].test((j.workType + " " + j.workTypeDetail).toLowerCase());

const state = { q: "", type: "", flags: new Set(), sort: "newest", selected: null, rendered: null, ids: [] };
const saved = new Set(store.get("saved", []));
const applied = new Set(store.get("applied", []));
const byId = new Map(DATA.jobs.map((j) => [j.id, j]));
const CATS = DATA.categories ?? [];
const catById = new Map(CATS.map((c) => [c.id, c]));
state.cat = catById.has(store.get("cat", "")) ? store.get("cat", "") : "";
const catTags = (j) => (j.categories ?? []).map((id) => catById.get(id)).filter(Boolean)
  .map((c) => `<span class="tag cat-tag" style="--c:${c.color}">${esc(c.short)}</span>`).join("");

function passesFilters(j, ignoreCategory = false) {
  const q = state.q.trim().toLowerCase();
  return (ignoreCategory || !state.cat || (j.categories ?? []).includes(state.cat)) &&
    (state.flags.has("closed") || isOpen(j)) &&
    (!state.flags.has("hospital") || j.isHospital) &&
    (!state.flags.has("new") || isNew(j)) &&
    (!state.flags.has("saved") || saved.has(j.id)) &&
    (!q || [j.title, j.company, j.location, j.summary, j.workplace].join(" ").toLowerCase().includes(q));
}
const SORTS = {
  newest: (a, b) => time(b.listedAt) - time(a.listedAt),
  salary: (a, b) => (b.salaryAnnual ?? -1) - (a.salaryAnnual ?? -1),
  rating: (a, b) => (b.seekRating?.value ?? -1) - (a.seekRating?.value ?? -1),
  company: (a, b) => a.company.localeCompare(b.company),
  distance: (a, b) => distanceKm(a) - distanceKm(b),
};
const visibleJobs = () => DATA.jobs.filter((j) => passesFilters(j) && matchesType(j, state.type)).sort(SORTS[state.sort]);

/* ---------- Hero ---------- */
function countUp(el, to, format = (n) => String(Math.round(n)), delay = 0) {
  if (reduceMotion || !to) { el.textContent = format(to); return; }
  const start = performance.now() + delay;
  const duration = 1600;
  const tick = (now) => {
    const p = Math.max(0, Math.min(1, (now - start) / duration));
    el.textContent = format(to * (1 - Math.pow(1 - p, 4)));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function median(values) {
  if (!values.length) return 0;
  const s = [...values].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
const GROUPS = [
  { key: "Seek", color: "var(--iris)" },
  { key: "Indeed", color: "var(--mint)" },
  { key: "LinkedIn", color: "var(--peach)" },
  { key: "Hospital sites", color: "var(--rose)" },
];
const groupOf = (name) => (["Seek", "Indeed", "LinkedIn"].includes(name) ? name : "Hospital sites");

// Headline, stats and source bar for the selected category (or all of them).
function renderHero() {
  const cat = catById.get(state.cat);
  const open = DATA.jobs.filter((j) => isOpen(j) && (!cat || (j.categories ?? []).includes(cat.id)));
  const city = DATA.city || "Melbourne";
  $("#h-city").textContent = city;
  $("#brand-city").textContent = city;
  const plural = cat?.plural ?? (CATS.length > 1 ? "allied health & exercise roles" : "Exercise Physiologist roles");
  $("#h-noun").textContent = open.length === 1 ? plural.replace(/roles$/, "role") : plural;
  countUp($("#h-count"), open.length, undefined, 150);
  const sites = DATA.careerSites ? ` and ${DATA.careerSites} hospital careers sites` : "";
  const labels = cat ? [cat.label] : CATS.map((c) => c.label);
  const kinds = labels.length > 1 ? `${labels.slice(0, -1).join(", ")} and ${labels.at(-1)}` : labels[0] ?? "EP";
  $("#lede").textContent = `Every ${kinds} role on Seek, Indeed, LinkedIn${sites}, in one place. Duplicates are merged, and each role shows its pay, hours and what it's like to work there.`;

  const salaries = open.map((j) => j.salaryAnnual).filter(Boolean);
  const tiles = [
    { label: "Open roles", value: open.length, sub: "each role counted once", icon: "layers", c: "var(--mint)" },
    { label: "Listed this week", value: open.filter(isNew).length, sub: "posted in the last 7 days", icon: "sparkle", c: "var(--peach)" },
    { label: "In hospitals", value: open.filter((j) => j.isHospital).length, sub: "public and private", icon: "hospital", c: "var(--iris)" },
    { label: "Median salary", value: median(salaries), sub: salaries.length ? `from ${salaries.length} advertised rates, yearly` : "no pay advertised yet", icon: "dollar", c: "var(--green)", money: true },
  ];
  $("#stats").innerHTML = tiles.map((t, i) => `
    <div class="stat spot reveal" style="--d:${260 + i * 75}ms;--c:${t.c}">
      <div class="ico">${icon(t.icon)}</div>
      <div class="n" data-i="${i}">${t.money ? "—" : "0"}</div>
      <div class="l">${t.label}</div>
      <div class="s">${esc(t.sub)}</div>
    </div>`).join("");
  tiles.forEach((t, i) => countUp($(`.stat .n[data-i="${i}"]`), t.value, t.money ? (n) => (t.value ? fmtK(n) : "—") : undefined, 320 + i * 75));

  const counts = Object.fromEntries(GROUPS.map((g) => [g.key, 0]));
  for (const j of open) for (const g of new Set(j.sources.map((s) => groupOf(s.name)))) counts[g]++;
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  $("#srcbar").classList.remove("go");
  $("#srcbar").innerHTML = GROUPS.filter((g) => counts[g.key]).map((g) => `<span style="--w:${(counts[g.key] / total) * 100}%;background:${g.color}" title="${g.key}: ${counts[g.key]}"></span>`).join("");
  $("#legend").innerHTML = GROUPS.map((g) => `<span><i style="background:${g.color}"></i>${g.key}<b>${counts[g.key]}</b></span>`).join("") + '<span class="legend-note">roles found on each source</span>';
  setTimeout(() => $("#srcbar").classList.add("go"), reduceMotion ? 0 : 750);
}
function renderLive() {
  $("#live").textContent = "Updated " + ago(DATA.generatedAt);
  $(".live").title = "Last check: " + new Date(DATA.generatedAt).toLocaleString("en-AU");
}

/* ---------- List ---------- */
function card(j, i) {
  const tags = [catTags(j)];
  if (isNew(j)) tags.push('<span class="tag new">New</span>');
  if (j.isHospital) tags.push(`<span class="tag hosp">${icon("hospital")}Hospital</span>`);
  if (j.salary && j.salaryAnnual) tags.push(`<span class="tag money">${esc(shortSalary(j))}</span>`);
  if (j.workType) tags.push(`<span class="tag">${esc(shortType(j.workType))}</span>`);
  if (HOME && j.place) tags.push(`<span class="tag dist" title="From ${esc(HOME.label)}">${icon("car")}${distanceLabel(j)}</span>`);
  if (applied.has(j.id)) tags.push(`<span class="tag done">${icon("check")}Applied</span>`);
  if (!isOpen(j)) tags.push('<span class="tag muted">No longer listed</span>');
  const active = j.id === state.selected;
  return `<article class="card spot${active ? " active" : ""}" data-id="${esc(j.id)}" role="option" aria-selected="${active}" style="--d:${Math.min(i, 12) * 40}ms">
    ${avatar(j)}
    <div>
      <h3>${esc(j.title)}</h3>
      <div class="org">${esc(j.company)}${place(j) ? `<span>·</span>${esc(place(j))}` : ""}</div>
      ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
    </div>
    <div class="c-side">
      <button class="save${saved.has(j.id) ? " on" : ""}" data-save="${esc(j.id)}" aria-label="${saved.has(j.id) ? "Remove from saved" : "Save role"}">${icon("star")}</button>
      <span class="ago">${esc(ago(j.listedAt))}</span>
    </div>
  </article>`;
}
function radar() {
  return '<div class="radar" aria-hidden="true"><div class="sweep"></div><b style="--x:28%;--y:36%"></b><b style="--x:66%;--y:30%;--dl:1.1s"></b><b style="--x:57%;--y:69%;--dl:2.2s"></b></div>';
}
function renderList() {
  const jobs = visibleJobs();
  state.ids = jobs.map((j) => j.id);
  const filtered = state.flags.size || state.type || state.q.trim();
  $("#count").innerHTML = `<b>${jobs.length}</b> role${jobs.length === 1 ? "" : "s"}${filtered ? '<button class="linkish" data-clear>Clear filters</button>' : ""}`;
  if (!state.ids.includes(state.selected)) state.selected = !isMobile() && jobs.length ? jobs[0].id : null;
  $("#list").innerHTML = jobs.length
    ? jobs.map(card).join("")
    : `<div class="empty">${radar()}<h3>No roles match</h3><p>Nothing fits these filters right now. New roles are checked for every couple of hours.</p><button class="btn" data-clear>Clear filters</button><button class="btn" data-refresh>${icon("refresh")}Refresh</button></div>`;
  if (!isMobile()) renderDetail(byId.get(state.selected));
  renderSegCounts();
  renderCats();
}
// Category tabs (All · EP · OT · ...), each counting the roles that match the other filters.
function renderCats() {
  const el = $("#cats");
  el.hidden = CATS.length < 2;
  const count = (id) => DATA.jobs.filter((j) => passesFilters(j, true) && matchesType(j, state.type) && (!id || (j.categories ?? []).includes(id))).length;
  el.innerHTML = [{ id: "", label: "All roles" }, ...CATS]

/* ---------- Travel from home ---------- */
// Distances are worked out when the report is built; the map (Leaflet + CARTO tiles) loads
// the first time a role with a location is opened, and the route shape comes from OSRM.
const HOME = DATA.home;
if (!HOME) $('#sort option[value="distance"]')?.remove();
function crowKm(a, b) {
  const rad = Math.PI / 180;
  const h = Math.sin(((b.lat - a.lat) * rad) / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(((b.lng - a.lng) * rad) / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const distanceKm = (j) => (j.place ? (j.place.km ?? crowKm(HOME, j.place)) : 1e9);
const distanceLabel = (j) => `${j.place.km == null || j.place.approx ? "~" : ""}${Math.round(distanceKm(j))} km`;
const duration = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr${m % 60 ? ` ${m % 60} min` : ""}`);

function travelBlock(j) {
  if (!HOME) return "";
  const p = j.place;
  // Brand-new roles may not have been located yet; directions still work from the ad's location text.
  const destination = p ? `${p.lat},${p.lng}` : encodeURIComponent(`${j.location || j.company}, Victoria, Australia`);
  const maps = (mode) => `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(`${HOME.label}, Victoria, Australia`)}&destination=${destination}&travelmode=${mode}`;
  let trip = "<b>Map coming soon</b><small>This role is new, so it gets its map at the next update, within about 2 hours. Directions work now.</small>";
  if (p) {
    const main = p.km != null ? `${Math.round(p.km)} km` : `~${Math.round(crowKm(HOME, p))} km`;
    const sub = p.km != null ? `about ${duration(p.mins)} by car, no traffic` : "in a straight line";
    const note = p.approx === "city"
      ? "The ad only says Melbourne, so this is measured to the CBD."
      : p.approx === "employer" ? "The ad gives no suburb, so this is measured to the employer's address." : `To ${p.label}`;
    trip = `<b>${main}</b> <span>${esc(sub)}</span><small>${esc(note)}</small>`;
  }
  return `<section class="block">
    <h4>${icon("car")}From ${esc(HOME.label)}</h4>
    <div class="travel-card">
      ${p ? `<div class="map" id="job-map" role="img" aria-label="Map from ${esc(HOME.label)} to the job"></div>` : ""}
      <div class="travel-meta">
        <div class="trip">${trip}</div>
        <div class="trip-links">
          <a class="pill" href="${safeUrl(maps("driving"))}" ${EXT}>${icon("car")}Directions</a>
          <a class="pill" href="${safeUrl(maps("transit"))}" ${EXT}>${icon("train")}Public transport</a>
        </div>
      </div>
    </div>
  </section>`;
}

let leafletReady = null;
function loadLeaflet() {
  leafletReady ??= new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = () => resolve(window.L);
    js.onerror = () => { leafletReady = null; reject(new Error("map library didn't load")); };
    document.head.appendChild(js);
  });
  return leafletReady;
}
let map = null;
// OpenStreetMap's own tiles need no key; in dark mode CSS turns them into a matching dark map.
const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";

// Road route from home to the job, cached for the session. Falls back to a straight dashed line.
async function routeShape(p) {
  const key = `ep-radar:route:${HOME.lat},${HOME.lng}>${p.lat},${p.lng}`;
  try { const hit = JSON.parse(sessionStorage.getItem(key)); if (hit) return hit; } catch {}
  const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${HOME.lng},${HOME.lat};${p.lng},${p.lat}?overview=simplified&geometries=geojson`);
  const coords = (await res.json()).routes?.[0]?.geometry?.coordinates?.map(([lng, lat]) => [lat, lng]);
  if (!coords) throw new Error("no route");
  try { sessionStorage.setItem(key, JSON.stringify(coords)); } catch {}
  return coords;
}

async function showMap(j) {
  map?.remove();
  map = null;
  const el = $("#job-map");
  if (!el) return;
  let L;
  try {
    L = await loadLeaflet();
  } catch {
    el.innerHTML = '<p class="map-off">The map needs an internet connection.</p>';
    return;
  }
  if (!el.isConnected || state.rendered !== j.id) return; // moved on to another role meanwhile
  const p = j.place;
  const color = catById.get(j.categories?.[0])?.color ?? "#8b8cf8";
  map = L.map(el, { zoomControl: false, scrollWheelZoom: false, dragging: !isMobile(), tap: false });
  L.tileLayer(TILE_URL, {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  const pin = (c) => L.divIcon({ className: "", html: `<span class="pin" style="--c:${c}"></span>`, iconSize: [16, 16], iconAnchor: [8, 8] });
  L.marker([HOME.lat, HOME.lng], { icon: pin("#4ade80"), title: HOME.label, keyboard: false }).addTo(map);
  L.marker([p.lat, p.lng], { icon: pin(color), title: p.label, keyboard: false }).addTo(map);
  map.fitBounds([[HOME.lat, HOME.lng], [p.lat, p.lng]], { padding: [36, 36], maxZoom: 13 });
  const shape = await routeShape(p).catch(() => null);
  if (!map || state.rendered !== j.id) return;
  const line = L.polyline(shape ?? [[HOME.lat, HOME.lng], [p.lat, p.lng]], {
    color, weight: 4, opacity: 0.9, className: shape ? "route-line" : "", dashArray: shape ? null : "6 8",
  }).addTo(map);
  if (shape) {
    line.getElement()?.setAttribute("pathLength", "1"); // lets the CSS draw the line in
    map.fitBounds(line.getBounds(), { padding: [30, 30] });
  }
}

/* ---------- Interaction ---------- */
function select(id) {
  if (!byId.has(id)) return;
  state.selected = id;
  $$(".card").forEach((c) => { const on = c.dataset.id === id; c.classList.toggle("active", on); c.setAttribute("aria-selected", on); });
  renderDetail(byId.get(id));
  if (isMobile()) openSheet();
  $(`.card[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
}
// On phones a role opens as a sheet. Opening adds a history entry, so the phone's back
// button or swipe-back closes the sheet instead of leaving the page.
function openSheet() {
  $("#detail").classList.add("open");
  $("#scrim").classList.add("on");
  document.body.classList.add("locked");
  if (!history.state?.epSheet) history.pushState({ epSheet: true }, "");
  setTimeout(() => map?.invalidateSize(), 550); // the map was sized while the sheet was off-screen
}
function hideSheet() {
  const sheet = $("#detail");
  sheet.classList.remove("open");
  sheet.style.transform = "";
  sheet.style.transition = "";
  $("#scrim").classList.remove("on");
  document.body.classList.remove("locked");
}
function closeSheet() {
  if (history.state?.epSheet) history.back(); // popstate below hides it
  else hideSheet();
}
addEventListener("popstate", hideSheet);

// Drag the sheet down to close it: from the top bar, or from anywhere once scrolled to the top.
(() => {
  const sheet = $("#detail");
  let startY = null;
  let dy = 0;
  let startTime = 0;
  sheet.addEventListener("touchstart", (e) => {
    if (!isMobile() || !sheet.classList.contains("open")) return;
    if (e.target.closest(".map")) return; // gestures on the map belong to the map
    if (!e.target.closest(".sheet-bar") && sheet.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    dy = 0;
    startTime = Date.now();
  }, { passive: true });
  sheet.addEventListener("touchmove", (e) => {
    if (startY == null) return;
    dy = e.touches[0].clientY - startY;
    if (dy <= 0) { // moving up: it's a normal scroll, let it through
      if (dy < -8) startY = null;
      return;
    }
    e.preventDefault();
    sheet.style.transition = "none";
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  sheet.addEventListener("touchend", () => {
    if (startY == null) return;
    const flick = dy > 40 && Date.now() - startTime < 250;
    startY = null;
    sheet.style.transition = "";
    if (dy > 110 || flick) closeSheet();
    else sheet.style.transform = "";
  });
})();
function toggle(set, key, id) { set.has(id) ? set.delete(id) : set.add(id); store.set(key, [...set]); }
function refreshMarks(id) {
  const isSaved = saved.has(id);
  $$(`[data-save="${CSS.escape(id)}"]`).forEach((b) => {
    b.classList.toggle("on", isSaved);
    const label = b.querySelector("span");
    if (label) label.textContent = isSaved ? "Saved" : "Save";
    const svg = b.querySelector("svg");
    svg.classList.remove("pop");
    void svg.getBoundingClientRect(); // restart the animation
    svg.classList.add("pop");
  });
  const isApplied = applied.has(id);
  $$(`[data-applied="${CSS.escape(id)}"]`).forEach((b) => { b.classList.toggle("done", isApplied); b.querySelector("span").textContent = isApplied ? "Applied" : "Mark as applied"; });
}
function refreshCard(id) {
  const old = $(`.card[data-id="${CSS.escape(id)}"]`);
  if (!old) return;
  const holder = document.createElement("div");
  holder.innerHTML = card(byId.get(id), 0);
  const fresh = holder.firstElementChild;
  fresh.style.animation = "none";
  old.replaceWith(fresh);
}

  state.q = ""; $("#q").value = "";

document.addEventListener("click", (e) => {
  const t = e.target;
  const saveBtn = t.closest("[data-save]");

    const id = saveBtn.dataset.save;
    toggle(saved, "saved", id);
    refreshMarks(id);

    return;
  }
  const appliedBtn = t.closest("[data-applied]");
  if (appliedBtn) {
    const id = appliedBtn.dataset.applied;
    toggle(applied, "applied", id);
    refreshMarks(id);
    refreshCard(id);
    return;
  }
  if (t.closest("[data-refresh]")) return refresh();
  if (t.closest("[data-toast-close]")) return hideToast();
  if (t.closest("[data-toast-act]")) return toastAction?.();
  if (t.closest("[data-clear]")) return clearFilters();

});

document.addEventListener("keydown", (e) => {
  const typing = document.activeElement?.matches("input, select, textarea");
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape") { if ($("#detail").classList.contains("open")) closeSheet(); else if (typing) document.activeElement.blur(); return; }
  if (typing || !state.ids.length) return;
  const down = e.key === "ArrowDown" || e.key === "j";
  const up = e.key === "ArrowUp" || e.key === "k";
  if (!down && !up) return;
  e.preventDefault();
  const i = state.ids.indexOf(state.selected);
  select(state.ids[down ? Math.min(state.ids.length - 1, i + 1) : Math.max(0, i - 1)]);

/* ---------- Refresh ---------- */
// GitHub checks the job sites every couple of hours and republishes this page. Refresh loads the
// newest published results, or says when the next check is due. No sign-in or setup needed.
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const onWeb = /^https?:$/.test(location.protocol);
let refreshing = false;
let toastAction = null;

function toast(text, kind = "info", opts = {}) {
  const el = $("#toast");
  const ico = kind === "busy" ? '<svg class="i spin" aria-hidden="true"><use href="#i-refresh"/></svg>' : icon(kind === "ok" ? "check" : kind === "err" ? "x" : "sparkle");
  el.className = `toast show ${kind}`;
  el.innerHTML = `<span class="t-ico">${ico}</span><span class="t-text">${esc(text)}</span>` +
    (opts.link ? `<a href="${safeUrl(opts.link)}" ${EXT}>Details</a>` : "") +
    (opts.action ? `<button class="t-act" data-toast-act>${esc(opts.action)}</button>` : "") +
    (kind === "busy" ? "" : `<button class="t-close" data-toast-close aria-label="Dismiss">${icon("x")}</button>`);
  toastAction = opts.onAction ?? null;
}
const hideToast = () => $("#toast").classList.remove("show");

// generatedAt of the copy currently published (cache-busted so the CDN can't serve a stale one).
async function publishedReportTime() {
  const res = await fetch(`${location.origin}${location.pathname}?t=${Date.now()}`, { cache: "no-store" });
  return (await res.text()).match(/"generatedAt":"([^"]+)"/)?.[1] ?? "";
}
// Reload with a one-off query string so the phone doesn't show its cached copy.
const loadNewest = () => location.replace(`${location.pathname}?v=${Date.now()}`);

async function refresh() {
  if (refreshing) return;
  if (!onWeb) return location.reload(); // opened as a file on the computer
  refreshing = true;
  $("#refresh").classList.add("busy");
  try {
    const [latest] = await Promise.all([publishedReportTime(), sleep(700)]); // let the icon spin
    if (latest > DATA.generatedAt) {
      toast("New results found. Updating…", "ok");
      setTimeout(loadNewest, 600);
      return;
    }
    const due = Date.parse(DATA.generatedAt) + ((DATA.checkEveryMinutes || 120) + 10) * 60000;
    const next = due > Date.now()
      ? `The next check is due around ${new Date(due).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" })}.`
      : "The next check is due any minute.";
    toast(`You're up to date. Last checked ${ago(DATA.generatedAt)}. ${next}`, "ok");
  } catch {
    toast("Couldn't check for new results. Are you online?", "err");
  } finally {
    refreshing = false;
    $("#refresh").classList.remove("busy");
  }
}

// When the phone comes back to this tab, say if newer results have been published since.
async function checkForUpdate() {
  if (!onWeb || refreshing) return;
  try {
    if ((await publishedReportTime()) > DATA.generatedAt) toast("New results are available.", "ok", { action: "Update", onAction: loadNewest });
  } catch {}
}

setThemeIcon();
renderHero();
renderLive();
renderList();
layout();
setInterval(renderLive, 60000);
document.fonts?.ready.then(moveSegPill);
if (/[?&]v=/.test(location.search)) history.replaceState(history.state, "", location.pathname); // tidy the URL after a refresh
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
setInterval(checkForUpdate, 5 * 60000);
</script>
</body>
</html>
