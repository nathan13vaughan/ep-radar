name: Check for EP jobs

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours (UTC); GitHub can start scheduled runs a few minutes late
  workflow_dispatch: # adds a "Run workflow" button for a manual check

permissions:
  contents: write # save the jobs database to the "state" branch
  pages: write # publish the report
  id-token: write

concurrency:
  group: ep-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Claude research runs on your Claude subscription through Claude Code (no API key).
      # Skipped until the CLAUDE_CODE_OAUTH_TOKEN secret exists; everything else still runs.
      - name: Install Claude Code
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # The jobs database lives on its own "state" branch (a single commit, replaced each run),
      # so the observer remembers what it has already seen and only notifies about new roles.
      - name: Restore saved jobs
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:jobs.db > data/jobs.db
            echo "Restored saved jobs ($(du -h data/jobs.db | cut -f1))"
          else
            echo "No saved jobs yet - this is the first run"
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Check job sites
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_URL: ${{ steps.pages.outputs.base_url }}/
        run: node --disable-warning=ExperimentalWarning src/index.js

      - name: Save jobs database
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/state
          cp data/jobs.db /tmp/state/jobs.db
          cd /tmp/state
          git init -q -b state
          git add jobs.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Saved jobs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

      - name: Build site
        run: |
          mkdir -p site
          cp report.html site/index.html
          cp web/* site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
